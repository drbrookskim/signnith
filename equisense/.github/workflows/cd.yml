name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-production
  cancel-in-progress: false   # 프로덕션 배포는 취소하지 않음

jobs:
  # ── CI 재실행 (배포 전 마지막 검증) ────────────────────────────────────
  verify:
    name: Pre-deploy verification
    uses: ./.github/workflows/ci.yml

  # ── Secrets 설정 여부 확인 ───────────────────────────────────────────────
  # job-level if:에서는 secrets 컨텍스트를 쓸 수 없으므로 needs.outputs로 전달
  check-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      has_aws: ${{ steps.check.outputs.has_aws }}
      has_vercel: ${{ steps.check.outputs.has_vercel }}
    steps:
      - name: Detect configured secrets
        id: check
        run: |
          [ -n "$AWS_KEY" ] \
            && echo "has_aws=true" >> "$GITHUB_OUTPUT" \
            || echo "has_aws=false" >> "$GITHUB_OUTPUT"
          [ -n "$VERCEL_TOKEN" ] \
            && echo "has_vercel=true" >> "$GITHUB_OUTPUT" \
            || echo "has_vercel=false" >> "$GITHUB_OUTPUT"
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ── 백엔드 배포: Serverless Framework → AWS Lambda ───────────────────
  deploy-backend:
    name: Deploy Backend (Serverless → AWS)
    runs-on: ubuntu-latest
    needs: [verify, check-secrets]
    if: needs.check-secrets.outputs.has_aws == 'true'
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (Serverless Framework)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to AWS Lambda (prod)
        run: serverless deploy --stage prod --verbose

  # ── 프론트엔드 배포: Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [verify, check-secrets]
    if: needs.check-secrets.outputs.has_vercel == 'true'
    environment: production

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (prod)
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
