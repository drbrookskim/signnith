[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equisense-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black==25.11.0",
    "bandit>=1.7",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "pydantic>=2.0",
    "redis>=5.0",
    # runtime deps needed by test imports
    "psycopg2-binary>=2.9",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "lambdas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP007",   # Union[X, Y] 허용
    "UP042",   # str + Enum 조합 허용 (StrEnum은 Python 3.11+에서만 안정적)
    "UP045",   # Optional[X] 허용 (X | None 대신 가독성 우선)
]

[tool.black]
line-length = 100
target-version = ["py311"]
