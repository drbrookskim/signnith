service: equisense-backend
frameworkVersion: "3"

# ---------------------------------------------------------------------------
# 공급자 (AWS)
# ---------------------------------------------------------------------------
provider:
  name: aws
  runtime: python3.11
  region: ap-northeast-2        # 서울 리전
  architecture: arm64           # Graviton2 (x86 대비 약 20% 비용 절감)
  memorySize: 256               # 함수별 override 가능
  timeout: 10                   # 동기 Lambda 최대 10초 (CLAUDE.md 규칙)
  logRetentionInDays: 14

  # 시크릿은 SSM Parameter Store에서 배포 시 해석합니다.
  # 로컬 개발: .env 파일 + serverless-dotenv-plugin
  # 프로덕션: CI/CD가 배포 전 SSM 값을 주입
  environment:
    STAGE: ${sls:stage}
    UPSTASH_REDIS_URL: ${ssm:/equisense/${sls:stage}/upstash-redis-url}
    FMP_API_KEY: ${ssm:/equisense/${sls:stage}/fmp-api-key}
    NEON_DATABASE_URL: ${ssm:/equisense/${sls:stage}/neon-database-url}
    ALPHA_VANTAGE_API_KEY: ${ssm:/equisense/${sls:stage}/alpha-vantage-api-key}
    # Module 3 환경변수
    DART_API_KEY: ${ssm:/equisense/${sls:stage}/dart-api-key}
    OPENAI_API_KEY: ${ssm:/equisense/${sls:stage}/openai-api-key}
    PINECONE_API_KEY: ${ssm:/equisense/${sls:stage}/pinecone-api-key}
    PINECONE_INDEX_NAME: ${ssm:/equisense/${sls:stage}/pinecone-index-name}
    ANTHROPIC_API_KEY: ${ssm:/equisense/${sls:stage}/anthropic-api-key}
    RAG_JOBS_QUEUE_URL: !Ref RagJobsQueue
    RAG_DOCS_BUCKET: equisense-rag-docs-${sls:stage}
    STATE_MACHINE_ARN: !Ref RagPipelineStateMachine
    # Phase 4 환경변수
    WS_ENDPOINT_URL: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
    PRICE_WATCHLIST: ${ssm:/equisense/${sls:stage}/price-watchlist, "AAPL,MSFT,AMZN,005930,035720"}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_APP_CLIENT_ID: !Ref CognitoUserPoolClient

  # 최소 권한 IAM
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:ap-northeast-2:*:parameter/equisense/${sls:stage}/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt RagJobsQueue.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::equisense-rag-docs-${sls:stage}/*
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource:
            - !Ref RagPipelineStateMachine
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${sls:stage}/POST/@connections/*"

# ---------------------------------------------------------------------------
# 플러그인
# ---------------------------------------------------------------------------
plugins:
  - serverless-python-requirements
  # - serverless-dotenv-plugin   # 로컬 개발 시 .env 주입 (선택)

# ---------------------------------------------------------------------------
# 커스텀 설정
# ---------------------------------------------------------------------------
custom:
  pythonRequirements:
    dockerizePip: non-linux     # Mac/Windows에서 Linux 네이티브 모듈 크로스 컴파일
    layer: true                 # 의존성을 Lambda Layer로 분리 (Cold Start 개선)
    slim: true
    slimPatterns:
      - "**/*.pyc"
      - "**/__pycache__/**"
      - "**/*.dist-info/**"

# ---------------------------------------------------------------------------
# 패키지 설정 (테스트/문서 파일 제외)
# ---------------------------------------------------------------------------
package:
  individually: false
  patterns:
    - "!tests/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!*.md"
    - "!pyproject.toml"
    - "!.env*"
    - "!node_modules/**"
    - "!.serverless/**"

# ---------------------------------------------------------------------------
# Lambda 함수 정의
# ---------------------------------------------------------------------------
functions:

  # ── Module 1: 펀더멘털 엔진 ────────────────────────────────────────────
  GetFundamentals:
    handler: lambdas/get_fundamentals/handler.lambda_handler
    description: "재무제표 조회 및 핵심 지표 계산 (Module 1)"
    memorySize: 256
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /companies/{ticker}/fundamentals
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoRestAuthorizer
          request:
            parameters:
              paths:
                ticker: true
              querystrings:
                market: true

  # ── Module 2: 해자 & 거시 동향 트래커 ──────────────────────────────────
  GetMoatScore:
    handler: lambdas/get_moat_score/handler.lambda_handler
    description: "경제적 해자 점수 조회 (Module 2)"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /companies/{ticker}/moat
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoRestAuthorizer
          request:
            parameters:
              paths:
                ticker: true
              querystrings:
                market: true

  # ── 실시간 주가 (클라이언트 직접 호출 — Redis 접속 정보 보호) ────────────
  GetPrice:
    handler: lambdas/get_price/handler.lambda_handler
    description: "Redis 캐시에서 실시간 주가 반환 — 인증 불필요, 공개 엔드포인트"
    memorySize: 128
    timeout: 5
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /prices/{ticker}
          method: GET
          cors: true
          request:
            parameters:
              paths:
                ticker: true

  # ── 헬스 체크 ────────────────────────────────────────────────────────
  HealthCheck:
    handler: lambdas/health/handler.lambda_handler
    description: "Neon DB 및 Redis 연결 상태 확인"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /health
          method: GET
          cors: true

  # ── Module 4: 기술적 분석 ──────────────────────────────────────────────
  GetTechnicalData:
    handler: lambdas/get_technical_data/handler.lambda_handler
    description: "일별 주가 이력 및 기술적 지표 조회 (Module 4)"
    memorySize: 256
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /companies/{ticker}/technical
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoRestAuthorizer
          request:
            parameters:
              paths:
                ticker: true
              querystrings:
                market: true
                period: false   # 기본값 '1y'

  # ── Module 3: AI 정성적 분석기 ─────────────────────────────────────────
  AnalysisOrchestrator:
    handler: lambdas/analysis_orchestrator/handler.lambda_handler
    description: "RAG 분석 작업 시작 — DB 등록 + SQS 큐잉 (Module 3)"
    memorySize: 256
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /companies/{ticker}/qualitative
          method: POST
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoRestAuthorizer
          request:
            parameters:
              paths:
                ticker: true

  GetJobStatus:
    handler: lambdas/get_job_status/handler.lambda_handler
    description: "비동기 분석 작업 상태 및 결과 조회"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /jobs/{job_id}
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoRestAuthorizer
          request:
            parameters:
              paths:
                job_id: true

  RAGTrigger:
    handler: lambdas/rag_trigger/handler.lambda_handler
    description: "SQS → Step Functions StartExecution (Module 3)"
    memorySize: 256
    timeout: 30
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - sqs:
          arn: !GetAtt RagJobsQueue.Arn
          batchSize: 1                 # 작업 하나씩 처리하여 실패 격리

  FetchDoc:
    handler: lambdas/fetch_doc/handler.lambda_handler
    description: "Step Functions State 1: DART/SEC 문서 다운로드 → S3 (Module 3)"
    memorySize: 512
    timeout: 840                       # 14분 (비동기 Worker 최대)
    layers:
      - !Ref PythonRequirementsLambdaLayer

  ChunkDoc:
    handler: lambdas/chunk_doc/handler.lambda_handler
    description: "Step Functions State 2: S3 PDF 청킹 → S3 (Module 3)"
    memorySize: 512
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer

  EmbedChunks:
    handler: lambdas/embed_chunks/handler.lambda_handler
    description: "Step Functions State 3: OpenAI 임베딩 → Pinecone (Module 3)"
    memorySize: 512
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer

  LLMAnalyze:
    handler: lambdas/llm_analyze/handler.lambda_handler
    description: "Step Functions State 4: Claude RAG 분석 → DB 저장 (Module 3)"
    memorySize: 512
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer

  HandlePipelineFailure:
    handler: lambdas/handle_pipeline_failure/handler.lambda_handler
    description: "Step Functions 파이프라인 실패 처리 — DB FAILED 업데이트"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer

  # ── Phase 4: EventBridge Workers ──────────────────────────────────────────
  MacroUpdateWorker:
    handler: lambdas/macro_update_worker/handler.lambda_handler
    description: "거시 지표 일별 수집 — Alpha Vantage → DB + Redis (Phase 4)"
    memorySize: 256
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - schedule:
          rate: cron(0 15 * * ? *)       # 매일 KST 00:00 (UTC 15:00)
          description: "Daily macro indicator update"

  PriceUpdateWorker:
    handler: lambdas/price_update_worker/handler.lambda_handler
    description: "장중 주가 수집 — Alpha Vantage → Redis (Phase 4)"
    memorySize: 256
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - schedule:
          rate: rate(5 minutes)          # 장중 5분 간격 갱신
          description: "Intraday price cache refresh"

  TechnicalScreener:
    handler: lambdas/technical_screener/handler.lambda_handler
    description: "저평가·과열 스크리닝 — 장 마감 후 일별 실행 (Phase 4)"
    memorySize: 256
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - schedule:
          rate: cron(0 16 * * ? *)       # 장 마감 직후 UTC 16:00
          description: "Daily technical screener"

  NewsIngestionWorker:
    handler: lambdas/news_ingestion_worker/handler.lambda_handler
    description: "일별 뉴스·공시 수집 — Alpha Vantage(US) + DART(KR) → Redis + DB (Phase 4)"
    memorySize: 256
    timeout: 840
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - schedule:
          rate: cron(0 9 * * ? *)        # 매일 KST 18:00 (UTC 09:00)
          description: "Daily news and disclosure ingestion"

  # ── Phase 4: WebSocket Cognito JWT Authorizer ─────────────────────────────
  CognitoWsAuthorizer:
    handler: lambdas/cognito_ws_authorizer/handler.lambda_handler
    description: "WebSocket $connect Cognito JWT Lambda Authorizer (Phase 4)"
    memorySize: 256
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer

  # ── Phase 4: WebSocket Lambda 트리오 ───────────────────────────────────────
  WsConnect:
    handler: lambdas/ws_connect/handler.lambda_handler
    description: "WebSocket $connect — 연결 ID DB 저장 (Phase 4)"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - websocket:
          route: $connect
          authorizer:
            name: CognitoWsAuthorizer
            identitySource: route.request.querystring.token

  WsDisconnect:
    handler: lambdas/ws_disconnect/handler.lambda_handler
    description: "WebSocket $disconnect — 연결 ID DB 삭제 (Phase 4)"
    memorySize: 128
    timeout: 10
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - websocket:
          route: $disconnect

  WsNotify:
    handler: lambdas/ws_notify/handler.lambda_handler
    description: "RAG 완료 이벤트 → WebSocket 결과 푸시 (Phase 4)"
    memorySize: 256
    timeout: 30
    layers:
      - !Ref PythonRequirementsLambdaLayer

# ---------------------------------------------------------------------------
# AWS 리소스 정의
# ---------------------------------------------------------------------------
resources:
  Resources:
    # ── SQS — RAG 작업 큐 ──────────────────────────────────────────────────
    RagJobsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: equisense-rag-jobs-${sls:stage}
        VisibilityTimeout: 900        # FetchDoc 최대 실행 시간(840s) + 여유
        MessageRetentionPeriod: 86400 # 24시간
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RagDLQ.Arn
          maxReceiveCount: 3          # 3회 실패 시 DLQ로 이동

    RagDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: equisense-rag-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600  # 14일

    # ── S3 — RAG 문서 중간 저장소 ───────────────────────────────────────────
    RagDocsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: equisense-rag-docs-${sls:stage}
        LifecycleConfiguration:
          Rules:
            - Id: DeleteRawAndChunks
              Status: Enabled
              ExpirationInDays: 7     # 처리 완료 후 7일 자동 삭제

    # ── Step Functions — RAG 파이프라인 Express Workflow ────────────────────
    RagPipelineStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: equisense-rag-${sls:stage}
        StateMachineType: STANDARD    # RAG 파이프라인은 5분을 초과할 수 있으므로 STANDARD 사용
        RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
        DefinitionString: !Sub |
          {
            "Comment": "EquiSense RAG Pipeline: FetchDoc → ChunkDoc → EmbedChunks → LLMAnalyze",
            "StartAt": "FetchDoc",
            "States": {
              "FetchDoc": {
                "Type": "Task",
                "Resource": "${FetchDocLambdaFunction.Arn}",
                "Next": "ChunkDoc",
                "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure"}]
              },
              "ChunkDoc": {
                "Type": "Task",
                "Resource": "${ChunkDocLambdaFunction.Arn}",
                "Next": "EmbedChunks",
                "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure"}]
              },
              "EmbedChunks": {
                "Type": "Task",
                "Resource": "${EmbedChunksLambdaFunction.Arn}",
                "Next": "LLMAnalyze",
                "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure"}]
              },
              "LLMAnalyze": {
                "Type": "Task",
                "Resource": "${LLMAnalyzeLambdaFunction.Arn}",
                "End": true,
                "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure"}]
              },
              "HandleFailure": {
                "Type": "Task",
                "Resource": "${HandlePipelineFailureLambdaFunction.Arn}",
                "End": true
              }
            }
          }

    StepFunctionsExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: equisense-stepfunctions-${sls:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: InvokeLambda
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource:
                    - !GetAtt FetchDocLambdaFunction.Arn
                    - !GetAtt ChunkDocLambdaFunction.Arn
                    - !GetAtt EmbedChunksLambdaFunction.Arn
                    - !GetAtt LLMAnalyzeLambdaFunction.Arn
                    - !GetAtt HandlePipelineFailureLambdaFunction.Arn

    # ── Cognito User Pool (Phase 4) ───────────────────────────────────────────
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: equisense-users-${sls:stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: equisense-app-${sls:stage}
        UserPoolId: !Ref CognitoUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false

    # ── REST API Cognito Authorizer (Phase 4) ─────────────────────────────────
    CognitoRestAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoRestAuthorizer-${sls:stage}
        Type: COGNITO_USER_POOLS
        RestApiId: !Ref ApiGatewayRestApi
        IdentitySource: method.request.header.Authorization
        ProviderARNs:
          - !GetAtt CognitoUserPool.Arn

    # ── WebSocket API (Phase 4) ───────────────────────────────────────────────
    WebSocketApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: equisense-ws-${sls:stage}
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: "$request.body.action"

    WebSocketStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref WebSocketApi
        StageName: ${sls:stage}
        AutoDeploy: true
