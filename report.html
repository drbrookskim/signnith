<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>리포트 — SIGNNITH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── CSS 변수: 다크 모드 (기본) ── */
  :root {
    --bg:       transparent;
    --card:     rgba(17,24,39,0.82);
    --card2:    rgba(15,19,32,0.75);
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --text:     #f1f5f9;
    --text2:    #e2e8f0;
    --muted:    #94a3b8;
    --muted2:   #64748b;
    --topbar:   rgba(10,8,30,0.82);
    --green:    #00d4aa;
    --red:      #ff4b6e;
    --up:       #ff4b6e;  /* 상승 = 빨간 */
    --down:     #3b82f6;  /* 하락 = 파란 */
    --yellow:   #fbbf24;
    --blue:     #3b82f6;
    --shadow:   rgba(0,0,0,.4);
    --desc-bg:  rgba(15,19,32,0.60);
    --divider:  rgba(255,255,255,0.07);
  }
  /* ── CSS 변수: 라이트 모드 ── */
  html.light {
    --bg:       transparent;
    --card:     rgba(255,255,255,0.78);
    --card2:    rgba(241,245,249,0.65);
    --border:   rgba(180,160,140,0.20);
    --border2:  rgba(180,160,140,0.30);
    --text:     #0f172a;
    --text2:    #1e293b;
    --muted:    #334155;
    --muted2:   #64748b;
    --topbar:   rgba(255,255,255,0.75);
    --green:    #047857;
    --red:      #be123c;
    --up:       #be123c;
    --down:     #1d4ed8;
    --yellow:   #b45309;
    --blue:     #1d4ed8;
    --shadow:   rgba(0,0,0,.10);
    --desc-bg:  rgba(241,245,249,0.70);
    --divider:  rgba(180,160,140,0.12);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Space Grotesk','Noto Sans KR',-apple-system,sans-serif;
    background: var(--bg);
    min-height:100vh;
    color: var(--text);
    transition: background .25s, color .25s;
  }

  /* ── Aurora Canvas ── */
  #aurora-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
    display: block;
  }
  /* ── Particle Network Canvas ── */
  #particle-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    display: block;
  }
  #main-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
  }

  /* ── Topbar ── */
  .topbar{
    background: var(--topbar);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 4px 24px var(--shadow);
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    position:sticky;
    top:0;
    z-index:100;
  }
  html.light .topbar {
    background: rgba(255,255,255,0.75);
    border-bottom: 1px solid rgba(180,160,140,0.18);
    box-shadow: 0 2px 24px rgba(120,90,70,0.10);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
  }
  .topbar-logo{
    display:flex; align-items:center; gap:10px;
    text-decoration:none;
  }
  .logo-img-r {
    height: 26px;
    width: auto;
    flex-shrink: 0;
    border-radius: 6px;
    transition: filter 0.2s, opacity 0.2s;
  }
  /* 다크 모드: 반전해서 밝게 */
  html:not(.light) .logo-img-r {
    filter: invert(1) brightness(0.92);
    opacity: 0.92;
  }
  /* 라이트 모드: 원본 그대로 */
  html.light .logo-img-r {
    filter: none;
    opacity: 0.85;
  }
  .topbar-right { display:flex; align-items:center; gap:8px; }
  .btn-icon {
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    border-radius:9px;
    border:1px solid var(--border2);
    background: var(--card2);
    color: var(--muted);
    cursor:pointer;
    transition:all .15s;
    font-family: inherit;
    padding:0;
  }
  .btn-icon:hover { color: var(--green); border-color: var(--green); }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.85rem;
    font-weight:600;
    color: var(--muted);
    text-decoration:none;
    padding:7px 14px;
    border:1px solid var(--border2);
    border-radius:10px;
    background: var(--card2);
    transition:all .15s;
  }
  .back-btn:hover{ color: var(--green); border-color: var(--green); }

  /* ── Page wrapper ── */
  .page{
    max-width:860px;
    margin:0 auto;
    padding:36px 20px 60px;
  }

  /* ── Loading / Error ── */
  .center-msg{
    text-align:center;
    padding:80px 20px;
    color: var(--muted2);
  }
  .spinner{
    width:36px; height:36px;
    border:3px solid rgba(4,120,87,.2);
    border-top-color: var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 16px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ── 로딩 스켈레톤 ── */
  @keyframes skel-shimmer {
    0%   { background-position: -700px 0; }
    100% { background-position:  700px 0; }
  }
  .skel {
    border-radius: 6px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.04) 25%,
      rgba(255,255,255,0.10) 50%,
      rgba(255,255,255,0.04) 75%);
    background-size: 700px 100%;
    animation: skel-shimmer 1.6s infinite linear;
  }
  html.light .skel {
    background: linear-gradient(90deg,
      rgba(0,0,0,0.05) 25%,
      rgba(0,0,0,0.12) 50%,
      rgba(0,0,0,0.05) 75%);
    background-size: 700px 100%;
    animation: skel-shimmer 1.6s infinite linear;
  }

  /* ── Main Title Card ── */
  .main-title-card{
    background: var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 32px;
    margin-bottom:20px;
    box-shadow:0 4px 24px var(--shadow);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .main-title-card h1{
    font-size:2rem;
    font-weight:700;
    color: var(--text);
    margin-bottom:6px;
    letter-spacing:-0.02em;
  }
  .main-title-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    font-size:0.85rem;
    color: var(--muted2);
    margin-top:12px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 12px;
    border-radius:20px;
    font-size:0.78rem;
    font-weight:600;
  }
  .badge-buy  { background:rgba(255,75,110,.15);  color:var(--up); }
  .badge-sell { background:rgba(59,130,246,.15);   color:var(--down); }
  .badge-hold { background:rgba(251,191,36,.15);  color:#fbbf24; }
  html.light .badge-buy  { background:rgba(190,18,60,.12);  color:var(--up); }
  html.light .badge-sell { background:rgba(29,78,216,.10);   color:var(--down); }
  html.light .badge-hold { background:rgba(180,160,100,.15);color:#92400e; }
  .price-display{
    font-size:2.4rem;
    font-weight:700;
    color: var(--text);
    letter-spacing:-0.03em;
  }
  .price-change{
    font-size:1rem;
    font-weight:600;
    margin-left:10px;
  }
  .up  { color: var(--up); }
  .down{ color: var(--down); }

  /* ── Section Card ── */
  .section-card{
    background: var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 32px;
    margin-bottom:16px;
    box-shadow:0 4px 24px var(--shadow);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .section-title{
    font-size:1.1rem;
    font-weight:700;
    color: var(--text);
    margin-bottom:24px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* ── Metric Row (wireframe layout) ── */
  .metric-block{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid var(--divider);
  }
  .metric-block:first-of-type{
    margin-top:0;
    padding-top:0;
    border-top:none;
  }
  .sub-title{
    font-size:1rem;
    font-weight:600;
    color: var(--text2);
    margin-bottom:10px;
  }

  /* Progress bar row */
  .bar-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:6px;
  }
  .bar-wrap{
    flex:1;
    height:12px;
    background: var(--card2);
    border-radius:99px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:99px;
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .bar-fill.bull { background:linear-gradient(90deg,#d97706,#f59e0b); }
  .bar-fill.bear { background:linear-gradient(90deg,#be123c,#f43f5e); }
  .bar-fill.neutral { background:linear-gradient(90deg,#64748b,#94a3b8); }
  .bar-value{
    min-width:80px;
    text-align:right;
    font-size:1rem;
    font-weight:700;
    color:#f59e0b;
    white-space:nowrap;
  }
  .bar-value.bear{ color: var(--down); }
  .bar-value.neutral{ color: var(--muted2); }

  /* Signal badge under bar */
  .signal-tag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:600;
    padding:2px 10px;
    border-radius:99px;
    margin-bottom:0;
  }
  .signal-tag.buy  { background:rgba(0,212,170,.12);  color:#00d4aa; }
  .signal-tag.sell { background:rgba(255,75,110,.12);  color:#ff4b6e; }
  .signal-tag.hold { background:rgba(148,163,184,.12); color: var(--muted); }
  html.light .signal-tag.buy  { background:rgba(4,120,87,.10);  color:#047857; }
  html.light .signal-tag.sell { background:rgba(190,18,60,.10);  color:#be123c; }
  html.light .signal-tag.hold { background:rgba(100,116,139,.10);color:#475569; }

  /* Description area — wireframe: 30px gap */
  .desc-section{
    margin-top:30px;
  }
  .desc-label{
    font-size:0.88rem;
    font-weight:700;
    color: var(--muted);
    margin-bottom:20px;
  }
  .desc-box{
    background: var(--desc-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 20px;
    margin-left:20px;
    font-size:0.84rem;
    color: var(--muted);
    line-height:1.7;
  }
  .desc-box b{ color: var(--text2); font-weight:600; }
  .desc-box .tag-buy  { color: var(--up);   font-weight:600; }
  .desc-box .tag-sell { color: var(--down); font-weight:600; }
  .desc-box .tag-warn { color: var(--yellow);font-weight:600; }

  /* ── Print / share bar ── */
  .action-bar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .action-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 18px;
    border-radius:12px;
    border:1px solid var(--border2);
    background: var(--card2);
    font-size:0.84rem;
    font-weight:600;
    color: var(--muted);
    cursor:pointer;
    transition:all .15s;
    font-family: inherit;
  }
  .action-btn:hover{ color: var(--green); border-color: var(--green); }

  /* ── Divider ── */
  .divider{ height:1px; background: var(--divider); margin:8px 0; }

  @media print{
    .topbar,.action-bar{ display:none; }
    .page{ padding:20px; }
    body{ background:#fff; }
  }
  /* 보관함 embedded 모드: topbar 숨김 */
  body.embedded .topbar { display:none !important; }
  @media(max-width:600px){
    .topbar{ padding:0 16px; }
    .page{ padding:20px 12px 40px; }
    .section-card,.main-title-card{ padding:20px 18px; }
    .desc-box{ margin-left:0; }
    .price-display{ font-size:1.8rem; }
  }
</style>
</head>
<body>

<canvas id="aurora-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<div id="main-wrap">

<header class="topbar">
  <a class="topbar-logo" href="index.html">
    <img class="logo-img-r" src="assets/signnith-logo-white.png" alt="Signnith" />
  </a>
  <div class="topbar-right">
    <!-- 공유 아이콘 버튼들 (우측 정렬) -->
    <button class="btn-icon" onclick="shareToThreads()" title="Threads에 공유">
      <svg width="16" height="16" viewBox="0 0 192 192" fill="currentColor"><path d="M141.537 88.988a66.667 66.667 0 0 0-2.518-1.143c-1.482-27.307-16.403-42.94-41.457-43.1h-.34c-14.986 0-27.449 6.396-35.12 18.036l13.779 9.452c5.73-8.695 14.724-10.548 21.348-10.548h.232c8.236.054 14.46 2.452 18.502 7.13 2.932 3.405 4.893 8.11 5.864 14.05-7.314-1.244-15.224-1.626-23.68-1.14-23.82 1.371-39.134 15.264-38.105 34.568.522 9.792 5.4 18.216 13.735 23.719 7.047 4.652 16.124 6.927 25.557 6.412 12.458-.683 22.231-5.436 29.049-14.127 5.178-6.6 8.453-15.153 9.899-25.93 5.937 3.583 10.337 8.298 12.767 13.966 4.132 9.635 4.373 25.468-8.546 38.376-11.319 11.308-24.925 16.2-45.488 16.351-22.809-.169-40.06-7.484-51.275-21.742C35.236 139.966 29.808 120.682 29.605 96c.203-24.682 5.63-43.966 16.133-57.317C56.954 24.425 74.204 17.11 97.013 16.94c22.975.17 40.526 7.52 52.171 21.847 5.71 7.026 10.015 15.86 12.853 26.162l16.147-4.308c-3.44-12.68-8.853-23.606-16.219-32.668C147.036 9.607 125.202.195 97.07 0h-.113C68.882.195 47.292 9.642 32.788 28.08 19.882 44.485 13.224 67.315 13.001 95.932L13 96v.067c.224 28.617 6.882 51.447 19.788 67.854C47.292 182.358 68.882 191.805 96.957 192h.113c24.96-.173 42.554-6.708 57.048-21.189 18.963-18.945 18.392-42.692 12.142-57.27-4.484-10.454-13.033-18.945-24.723-24.553zm-43.16 40.512c-10.44.588-21.286-4.098-21.82-14.135-.397-7.442 5.296-15.745 22.461-16.735 1.966-.113 3.895-.169 5.79-.169 6.235 0 12.068.606 17.371 1.765-1.978 24.702-13.58 28.713-23.802 29.274z"/></svg>
    </button>
    <button class="btn-icon" onclick="shareToX()" title="X(트위터)에 공유">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.631 5.905-5.631zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </button>
    <button class="btn-icon" onclick="navigator.clipboard?.writeText(location.href).then(()=>alert('링크 복사됨'))" title="링크 복사">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="btn-icon" onclick="window.print()" title="인쇄 / PDF">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
    <button class="back-btn" onclick="window.close()" style="cursor:pointer;border:none;text-decoration:none">✕ Close</button>
  </div>
</header>

<div class="page">
  <div id="report-content">
    <!-- 로딩 스켈레톤: JS가 실제 콘텐츠로 교체 -->
    <div class="main-title-card">
      <div class="skel" style="width:80px;height:20px;margin-bottom:14px"></div>
      <div class="skel" style="width:58%;height:34px;margin-bottom:14px"></div>
      <div class="skel" style="width:38%;height:50px;margin-bottom:12px"></div>
      <div class="skel" style="width:72%;height:14px"></div>
    </div>
    <div class="section-card">
      <div class="skel" style="width:42%;height:20px;margin-bottom:22px"></div>
      <div class="skel" style="width:100%;height:56px;margin-bottom:10px;border-radius:10px"></div>
      <div class="skel" style="width:100%;height:56px;margin-bottom:10px;border-radius:10px"></div>
      <div class="skel" style="width:65%;height:14px;margin-top:6px"></div>
    </div>
    <div class="section-card">
      <div class="skel" style="width:38%;height:20px;margin-bottom:22px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="skel" style="height:48px;border-radius:8px"></div>
        <div class="skel" style="height:48px;border-radius:8px"></div>
        <div class="skel" style="height:48px;border-radius:8px"></div>
      </div>
      <div class="skel" style="width:100%;height:40px;border-radius:8px"></div>
    </div>
    <div class="section-card">
      <div class="skel" style="width:50%;height:20px;margin-bottom:22px"></div>
      <div class="skel" style="width:100%;height:90px;border-radius:8px"></div>
    </div>
    <div class="section-card">
      <div class="skel" style="width:45%;height:20px;margin-bottom:22px"></div>
      <div class="skel" style="width:100%;height:120px;border-radius:8px"></div>
    </div>
  </div>
</div>

</div><!-- /#main-wrap -->

<script>
// ══════════════════════════════════════════════════════
//  한국 종목명 사전 (ticker → name)
// ══════════════════════════════════════════════════════
const KR_NAME_MAP = {

  '055550.KS':'신한지주','051910.KS':'LG화학','006400.KS':'삼성SDI',
  '012330.KS':'현대모비스','005490.KS':'POSCO홀딩스','035720.KS':'카카오',
  '035420.KS':'NAVER','096770.KS':'SK이노베이션','086790.KS':'하나금융지주',
  '316140.KS':'우리금융지주','028260.KS':'삼성물산','066570.KS':'LG전자',
  '017670.KS':'SK텔레콤','030200.KS':'KT','032640.KS':'LG유플러스',
  '034020.KS':'두산에너빌리티','012450.KS':'한화에어로스페이스','042660.KS':'한화오션',

const PROXIES = [
  'https://corsproxy.io/?url=',
  'https://api.allorigins.win/raw?url=',
];

async function fetchWithProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const resp = await fetch(proxy + encodeURIComponent(url));
      if (resp.ok) return resp;
    } catch { /* next proxy */ }
  }
  throw new Error('모든 프록시 실패');
}

const SECTOR_ADJ_R = {
  'Technology':           { erpAdj: 0.010, sizeAdj: 0.005 },
  'Consumer Cyclical':    { erpAdj: 0.005, sizeAdj: 0.000 },
  'Healthcare':           { erpAdj: 0.005, sizeAdj: 0.000 },

  'Industrials':          { erpAdj: 0.000, sizeAdj: 0.000 },
  'Consumer Defensive':   { erpAdj:-0.005, sizeAdj:-0.003 },
  'Energy':               { erpAdj: 0.010, sizeAdj: 0.005 },
  'Basic Materials':      { erpAdj: 0.005, sizeAdj: 0.000 },
  'Real Estate':          { erpAdj:-0.005, sizeAdj: 0.000 },
  'Utilities':            { erpAdj:-0.010, sizeAdj: 0.000 },
  'Communication Services':{ erpAdj: 0.005, sizeAdj: 0.000 },
};
function computeWACCR(fundInfo, isKr) {
  const rfRate = isKr ? 0.035 : 0.043;
  const erp    = isKr ? 0.065 : 0.055;
  const sector = fundInfo.sector || '';
  const adj    = SECTOR_ADJ_R[sector] || { erpAdj:0, sizeAdj:0 };
  const adjErp = erp + adj.erpAdj;
  const beta   = fundInfo.beta || 1.0;
  const re     = rfRate + beta * adjErp + adj.sizeAdj;
  const mktCap = fundInfo.marketCap || 0;
  const totDebt= fundInfo.totalDebt || 0;
  const totalV = mktCap + totDebt;
  const eRatio = totalV > 0 ? mktCap / totalV : 0.8;
  const deRatio= 1 - eRatio;
  const tc     = isKr ? 0.25 : 0.21;
  const ebit   = fundInfo.ebitda != null ? fundInfo.ebitda * 0.85 : null;
  const intExp = (totDebt > 0 && ebit != null) ? ebit / Math.max(1, totDebt * 0.05) : null;
  const icov   = (ebit != null && intExp != null && intExp > 0) ? ebit / intExp : null;
  let rdPre;
  if (icov == null)       rdPre = rfRate + 0.04;
  else if (icov >= 8.5)   rdPre = rfRate + 0.010;
  else if (icov >= 4.25)  rdPre = rfRate + 0.020;
  else if (icov >= 2.5)   rdPre = rfRate + 0.035;
  else if (icov >= 1.5)   rdPre = rfRate + 0.060;
  else                    rdPre = rfRate + 0.100;
  const rd   = rdPre * (1 - tc);
  const wacc = eRatio * re + deRatio * rd;
  return { wacc, re, rd, rfRate, beta, adjErp, erpAdj: adj.erpAdj, tc, eRatio, deRatio, interestCoverage: icov, sectorLabel: sector || '기타' };
}

function fmt(n, isKr) {
  if (n==null||isNaN(n)) return '-';
  return isKr
    ? Math.round(n).toLocaleString('ko-KR')
    : n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pct(n, digits=2) {
  if (n==null||isNaN(n)) return '-';
  return (n>=0?'+':'')+n.toFixed(digits)+'%';
}

async function fetchOHLCV(ticker, period='6mo') {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=${period}&includePrePost=false`;
  const resp = await fetchWithProxy(url);
  if (!resp.ok) throw new Error(`가격 데이터 조회 실패 (${resp.status})`);
  const json = await resp.json();
  const result = json.chart?.result?.[0];
  if (!result) throw new Error('데이터 없음');
  const ts=result.timestamp||[], q=result.indicators.quote[0], adj=result.indicators.adjclose?.[0]?.adjclose, meta=result.meta||{};
  const rawBars = ts.map((t,i)=>({
    date:new Date(t*1000), open:q.open[i], high:q.high[i], low:q.low[i],
    close:(adj&&adj[i])?adj[i]:q.close[i], volume:q.volume[i]||0,
  }));
  const bars = rawBars.filter(b=>b.close!=null&&b.high!=null&&b.low!=null&&!isNaN(b.close));
  if (bars.length<30) throw new Error('데이터 부족');
  return { bars, currency:meta.currency||'USD', regularMarketPrice:meta.regularMarketPrice,
    previousClose:meta.chartPreviousClose||meta.previousClose };
}

function calcEMA(arr,span){
  const k=2/(span+1),out=new Array(arr.length).fill(null);
  let start=arr.findIndex(v=>v!=null);
  if(start<0||start+span>arr.length) return out;
  let val=arr.slice(start,start+span).reduce((a,b)=>a+b,0)/span;
  out[start+span-1]=val;
  for(let i=start+span;i<arr.length;i++){if(arr[i]!=null){val=arr[i]*k+val*(1-k);out[i]=val;}}
  return out;
}

function computeIndicators(bars){
  const n=bars.length,C=bars.map(b=>b.close),H=bars.map(b=>b.high),L=bars.map(b=>b.low),V=bars.map(b=>b.volume);
  const ema12=calcEMA(C,12),ema26=calcEMA(C,26);
  const macdLine=C.map((_,i)=>(ema12[i]!=null&&ema26[i]!=null)?ema12[i]-ema26[i]:null);
  const mOV=macdLine.filter(v=>v!=null),sigShort=calcEMA(mOV,9);
  let si=0;const sigLine=macdLine.map(v=>v!=null?sigShort[si++]??null:null);
  const hist=macdLine.map((v,i)=>(v!=null&&sigLine[i]!=null)?v-sigLine[i]:null);
  const rsi=new Array(n).fill(null);
  if(n>14){let ag=0,al=0;for(let i=1;i<=14;i++){const d=C[i]-C[i-1];d>0?ag+=d:al-=d;}ag/=14;al/=14;
    rsi[14]=al===0?100:100-100/(1+ag/al);
    for(let i=15;i<n;i++){const d=C[i]-C[i-1],g=Math.max(d,0),l=Math.max(-d,0);ag=(ag*13+g)/14;al=(al*13+l)/14;rsi[i]=al===0?100:100-100/(1+ag/al);}}
  const stochK=new Array(n).fill(null),stochD=new Array(n).fill(null);
  for(let i=13;i<n;i++){const lo=Math.min(...L.slice(i-13,i+1)),hi=Math.max(...H.slice(i-13,i+1));stochK[i]=hi===lo?50:100*(C[i]-lo)/(hi-lo);}
  for(let i=15;i<n;i++){if(stochK[i]!=null&&stochK[i-1]!=null&&stochK[i-2]!=null)stochD[i]=(stochK[i]+stochK[i-1]+stochK[i-2])/3;}
  const sma5=new Array(n).fill(null),sma50=new Array(n).fill(null);
  for(let i=4;i<n;i++) sma5[i]=C.slice(i-4,i+1).reduce((a,b)=>a+b,0)/5;
  for(let i=49;i<n;i++) sma50[i]=C.slice(i-49,i+1).reduce((a,b)=>a+b,0)/50;
  const sma20=new Array(n).fill(null),bbU=new Array(n).fill(null),bbL=new Array(n).fill(null),bbPct=new Array(n).fill(null);
  for(let i=19;i<n;i++){const sl=C.slice(i-19,i+1),m=sl.reduce((a,b)=>a+b,0)/20,std=Math.sqrt(sl.reduce((a,b)=>a+(b-m)**2,0)/20);sma20[i]=m;bbU[i]=m+2*std;bbL[i]=m-2*std;bbPct[i]=(bbU[i]-bbL[i])>0?(C[i]-bbL[i])/(bbU[i]-bbL[i]):0.5;}
  const atr=new Array(n).fill(null),tr=new Array(n).fill(null);
  for(let i=1;i<n;i++)tr[i]=Math.max(H[i]-L[i],Math.abs(H[i]-C[i-1]),Math.abs(L[i]-C[i-1]));
  if(n>14){let a=tr.slice(1,15).reduce((s,v)=>s+v,0)/14;atr[14]=a;for(let i=15;i<n;i++){a=(a*13+tr[i])/14;atr[i]=a;}}
  const volRatio=new Array(n).fill(null);
  for(let i=19;i<n;i++){const avg=V.slice(i-19,i+1).reduce((a,b)=>a+(b||0),0)/20;volRatio[i]=avg>0?(V[i]||0)/avg:1;}
  return{C,H,L,V,macdLine,sigLine,hist,rsi,stochK,stochD,sma5,sma20,sma50,bbU,bbL,bbPct,atr,volRatio};
}

function _pivotsR(bars, key, w=3) {
  return bars.map((b,i) => {
    const v = b[key];
    const slice = bars.slice(Math.max(0,i-w), i+w+1).map(x=>x[key]);
    const hi = slice.every(s => s <= v);
    const lo = slice.every(s => s >= v);
    return { i, v, hi, lo };
  });
}

function computeChartPatternV2R(bars, ind) {
  if (!bars || bars.length < 10) return [];
  const detected = [];

  const last = bars[n-1];
  const prev = bars[n-2] || last;

  const ma50 = ind?.ma50 ?? null;
  const vol  = last.volume ?? 0;
  const avgVol = bars.slice(-20).reduce((s,b)=>s+(b.volume||0),0)/20 || 1;
  const maDesc = ma5 && ma20
    ? (ma5 > ma20 ? `MA5(${ma5?.toFixed?.(0)}) > MA20(${ma20?.toFixed?.(0)}) 정배열` : `MA5(${ma5?.toFixed?.(0)}) < MA20(${ma20?.toFixed?.(0)}) 역배열`)

  // 골든/데드크로스

    if (prevMa5 && prevMa50) {

        detected.push({ id:'GOLDEN_CROSS', name:'골든크로스', signal:'BUY', confidence:80, entry:'단기선(MA5) 장기선(MA50) 상향 돌파', stop:'MA50 하향 이탈 시', chart3:{candle:`종가 ${last.close?.toFixed?.(0)}`,volume:volDesc,ma:maDesc} });
      else if (prevMa5 >= prevMa50 && ma5 < ma50)
        detected.push({ id:'DEAD_CROSS', name:'데드크로스', signal:'SELL', confidence:80, entry:'단기선(MA5) 장기선(MA50) 하향 이탈', stop:'MA50 상향 돌파 시', chart3:{candle:`종가 ${last.close?.toFixed?.(0)}`,volume:volDesc,ma:maDesc} });
    }
  }
  // MA20 이탈
  if (ma20 && last.close < ma20 * 0.98 && prev.close >= ma20)
    detected.push({ id:'MA20_BREAKDOWN', name:'20일선 이탈', signal:'SELL', confidence:75, entry:'종가 20일선 하향 이탈', stop:'20일선 회복 시', chart3:{candle:`종가 ${last.close?.toFixed?.(0)} < MA20 ${ma20?.toFixed?.(0)}`,volume:volDesc,ma:maDesc} });
  // 상승 장악형
  if (prev.close < prev.open && last.close > last.open) {
    const pb = prev.open - prev.close, cb = last.close - last.open;
    if (cb > pb * 1.0 && last.close > prev.open && last.open < prev.close)
      detected.push({ id:'BULLISH_ENGULFING', name:'상승 장악형', signal:'STRONG_BUY', confidence:90, entry:'전일 음봉 완전 포함 대형 양봉', stop:'전일 저점 하향 이탈', chart3:{candle:'전일 음봉 완전 포함',volume:volDesc,ma:maDesc} });
  }
  // Gap Up/Down
  if (last.open > prev.high * 1.005)
    detected.push({ id:'GAP_UP', name:'갭 상승', signal:'BUY', confidence:85, entry:`갭 상승 (전고: ${prev.high?.toFixed?.(0)} → 시가: ${last.open?.toFixed?.(0)})`, stop:'갭 하단 이탈 시', chart3:{candle:`갭 +${((last.open/prev.high-1)*100).toFixed(1)}%`,volume:volDesc,ma:maDesc} });
  else if (last.open < prev.low * 0.995)
    detected.push({ id:'GAP_DOWN', name:'갭 하락', signal:'SELL', confidence:80, entry:`갭 하락 (전저: ${prev.low?.toFixed?.(0)} → 시가: ${last.open?.toFixed?.(0)})`, stop:'갭 상단 돌파 시', chart3:{candle:`갭 ${((last.open/prev.low-1)*100).toFixed(1)}%`,volume:volDesc,ma:maDesc} });

  // 피봇 기반 패턴
  if (bars.length >= 20) {
    const highs = _pivotsR(bars,'high',3), lows = _pivotsR(bars,'low',3);
    const topPivots = highs.filter(p=>p.hi).slice(-4);
    if (topPivots.length >= 2) {
      const [p1,p2] = topPivots.slice(-2);
      if (Math.abs(p1.v-p2.v)/p1.v < 0.03 && p2.i > p1.i) {
        const neckLow = Math.min(...bars.slice(p1.i,p2.i).map(b=>b.low));
        if (last.close < neckLow*0.99)
          detected.push({ id:'DOUBLE_TOP', name:'쌍봉 (Double Top)', signal:'STRONG_SELL', confidence:100, entry:'넥라인 하향 이탈 — 매도', stop:`두 번째 고점(${p2.v?.toFixed?.(0)}) 위`, chart3:{candle:`두 고점 ${p1.v?.toFixed?.(0)}/${p2.v?.toFixed?.(0)}`,volume:volDesc,ma:maDesc} });
      }
    }
    const botPivots = lows.filter(p=>p.lo).slice(-4);
    if (botPivots.length >= 2) {
      const [p1,p2] = botPivots.slice(-2);
      if (Math.abs(p1.v-p2.v)/p1.v < 0.03 && p2.i > p1.i) {
        const neckHigh = Math.max(...bars.slice(p1.i,p2.i).map(b=>b.high));
        if (last.close > neckHigh*1.01)
          detected.push({ id:'DOUBLE_BOTTOM', name:'쌍바닥 (Double Bottom)', signal:'STRONG_BUY', confidence:100, entry:'넥라인 상향 돌파 — 매수', stop:`두 번째 저점(${p2.v?.toFixed?.(0)}) 아래`, chart3:{candle:`두 저점 ${p1.v?.toFixed?.(0)}/${p2.v?.toFixed?.(0)}`,volume:volDesc,ma:maDesc} });
      }
    }
  }
  // 도지
  const body = Math.abs(last.close - last.open), range = last.high - last.low || 1;
  if (body/range < 0.1)
    detected.push({ id:'DOJI', name:'도지 (Doji)', signal:'WAIT', confidence:70, entry:'방향성 미결정 — 다음 봉 확인', stop:'-', chart3:{candle:'몸통 극소 도지형',volume:volDesc,ma:maDesc} });

  return detected;
}

function computeCandlestick(bars){
  const n=bars.length;if(n<3)return{cs_signal:0,cs_score:0,patterns:[]};
  const O=bars.map(b=>b.open),H=bars.map(b=>b.high),L=bars.map(b=>b.low),C=bars.map(b=>b.close);
  const i=n-1,body=j=>Math.abs(C[j]-O[j]),rng=j=>H[j]-L[j]||1e-9,upper=j=>H[j]-Math.max(O[j],C[j]),lower=j=>Math.min(O[j],C[j])-L[j],isBull=j=>C[j]>O[j];
  let bullScore=0,bearScore=0;const detectedPatterns=[];
  if(body(i)/rng(i)<0.1) detectedPatterns.push('Doji');
  if(lower(i)>body(i)*2&&upper(i)<body(i)*0.3&&isBull(i)){detectedPatterns.push('Hammer');bullScore++;}
  if(upper(i)>body(i)*2&&lower(i)<body(i)*0.3&&!isBull(i)){detectedPatterns.push('ShootingStar');bearScore++;}
  if(i>=1){
    if(!isBull(i-1)&&isBull(i)&&O[i]<C[i-1]&&C[i]>O[i-1]){detectedPatterns.push('BullishEngulfing');bullScore+=2;}
    if(isBull(i-1)&&!isBull(i)&&O[i]>C[i-1]&&C[i]<O[i-1]){detectedPatterns.push('BearishEngulfing');bearScore+=2;}
  }
  if(i>=2){
    const pDoji=body(i-1)/rng(i-1)<0.1;
    if(!isBull(i-2)&&pDoji&&isBull(i)){detectedPatterns.push('MorningStar');bullScore+=2;}
    if(isBull(i-2)&&pDoji&&!isBull(i)){detectedPatterns.push('EveningStar');bearScore+=2;}
    if(isBull(i)&&isBull(i-1)&&isBull(i-2)&&C[i]>C[i-1]&&C[i-1]>C[i-2]){detectedPatterns.push('ThreeWhiteSoldiers');bullScore+=2;}
    if(!isBull(i)&&!isBull(i-1)&&!isBull(i-2)&&C[i]<C[i-1]&&C[i-1]<C[i-2]){detectedPatterns.push('ThreeBlackCrows');bearScore+=2;}
  }
  const cs_score=bullScore-bearScore;
  return{cs_signal:cs_score>0?1:cs_score<0?-1:0,cs_score,patterns:detectedPatterns};
}

function computeElliottWave(bars){
  const closes=bars.map(b=>b.close),n=closes.length,sw=Math.max(5,Math.floor(n/20));
  const highs=[],lows=[];
  for(let i=sw;i<n-sw;i++){const w=closes.slice(i-sw,i+sw+1);if(closes[i]===Math.max(...w))highs.push({idx:i,val:closes[i]});if(closes[i]===Math.min(...w))lows.push({idx:i,val:closes[i]});}
  const swings=[...highs.map(h=>({...h,type:'H'})),...lows.map(l=>({...l,type:'L'}))].sort((a,b)=>a.idx-b.idx).slice(-10);
  const pivotHigh=Math.max(...closes.slice(-sw*2)),pivotLow=Math.min(...closes.slice(-sw*2));
  let ew_signal=0,wave_label='분석 불충분',entry_zone={};
  if(swings.length>=5){
    const pts=swings.slice(-5).map(s=>s.val),w1=pts[1]-pts[0],w3=pts[3]-pts[2];
    const w2r=w1!==0?(pts[1]-pts[2])/(pts[1]-pts[0]):0,w4r=w3!==0?(pts[3]-pts[4])/(pts[3]-pts[2]):0;
    if(pts[1]>pts[0]&&pts[3]>pts[2]&&pts[4]<pts[3]&&w2r>=0.382&&w2r<=0.786&&w4r>=0.236&&w4r<=0.5){
      wave_label='5파 완성 → 조정 예상';ew_signal=-1;
    } else if(w2r>=0.382){wave_label='ABC 조정 완료 → 매수 구간';ew_signal=1;}
    else{wave_label='파동 진행 중';}
  }
  return{ew_signal,wave_label,pivot_high:pivotHigh,pivot_low:pivotLow};
}

function computeIchimoku(bars){
  const n=bars.length,H=bars.map(b=>b.high),L=bars.map(b=>b.low),C=bars.map(b=>b.close);
  const midN=len=>{if(n<len)return null;const sl=bars.slice(n-len);return(Math.max(...sl.map(b=>b.high))+Math.min(...sl.map(b=>b.low)))/2;};
  const tk=midN(9),kj=midN(26),ska=(tk!=null&&kj!=null)?(tk+kj)/2:null,skb=midN(52);
  const lastClose=C[n-1];
  const aboveCloud=ska!=null&&skb!=null&&lastClose>ska&&lastClose>skb;
  const belowCloud=ska!=null&&skb!=null&&lastClose<ska&&lastClose<skb;
  let ichi_signal=0;
  if(aboveCloud)ichi_signal=1;else if(belowCloud)ichi_signal=-1;
  return{ichi_signal,tenkan:tk,kijun:kj,senkou_a:ska,senkou_b:skb,aboveCloud,belowCloud};
}

function computeSMC(bars){
  const n=bars.length;if(n<20)return{smc_signal:0,bos:null,fvg:null,ob:null};
  const H=bars.map(b=>b.high),L=bars.map(b=>b.low),C=bars.map(b=>b.close),O=bars.map(b=>b.open);
  const i=n-1,sw=10;
  const prevHi=Math.max(...H.slice(Math.max(0,i-sw),i)),prevLo=Math.min(...L.slice(Math.max(0,i-sw),i));
  const bos_bull=C[i]>prevHi&&C[i-1]<=prevHi,bos_bear=C[i]<prevLo&&C[i-1]>=prevLo;
  const fvg_bull=i>=2&&L[i]>H[i-2],fvg_bear=i>=2&&H[i]<L[i-2];
  const ob_demand=i>=2&&C[i-1]<O[i-1]&&C[i]>H[i-1],ob_supply=i>=2&&C[i-1]>O[i-1]&&C[i]<L[i-1];
  let smc_signal=0;
  if(bos_bull||fvg_bull||ob_demand)smc_signal=1;
  if(bos_bear||fvg_bear||ob_supply)smc_signal=-1;
  return{smc_signal,bos:bos_bull?'강세 BOS':bos_bear?'약세 BOS':null,fvg:fvg_bull?'상승 FVG':fvg_bear?'하락 FVG':null,ob:ob_demand?'수요 OB':ob_supply?'공급 OB':null};
}

function computeQuantFactors(bars,ind){
  const n=bars.length,C=bars.map(b=>b.close);
  const mom1m=n>21?(C[n-1]-C[n-22])/C[n-22]:null,mom3m=n>63?(C[n-1]-C[n-64])/C[n-64]:null,mom6m=n>126?(C[n-1]-C[n-127])/C[n-127]:null;
  const ma20=ind.sma20[n-1],ma60=n>=60?C.slice(n-60).reduce((a,b)=>a+b,0)/60:null;
  const above_ma20=ma20!=null?(C[n-1]>ma20?1:-1):0,above_ma60=ma60!=null?(C[n-1]>ma60?1:-1):0;
  let vol20=null;
  if(n>=21){const rets=C.slice(n-21).map((v,i,a)=>i>0?(v-a[i-1])/a[i-1]:null).filter(v=>v!=null);const mean=rets.reduce((a,b)=>a+b,0)/rets.length;vol20=Math.sqrt(rets.reduce((a,b)=>a+(b-mean)**2,0)/rets.length)*Math.sqrt(252);}
  const rsiV=last(ind.rsi),macdH=last(ind.hist),bbP=last(ind.bbPct);
  const momZ=mom1m!=null?Math.tanh(mom1m*5):0,mom3Z=mom3m!=null?Math.tanh(mom3m*3):0,mom6Z=mom6m!=null?Math.tanh(mom6m*2):0;
  const trendZ=(above_ma20+above_ma60)/2,rsiZ=rsiV!=null?(rsiV<30?0.8:rsiV>70?-0.8:(50-rsiV)/50*0.4):0;
  const macdZ=macdH!=null?Math.tanh(macdH/(last(ind.atr)||1)*3):0,bbZ=bbP!=null?(1-2*bbP)*0.5:0,volZ=vol20!=null?-Math.tanh(vol20*2)*0.5:0;
  const factor_score=momZ*0.2+mom3Z*0.15+mom6Z*0.1+trendZ*0.15+rsiZ*0.1+macdZ*0.15+bbZ*0.1+volZ*0.05;
  return{quant_signal:factor_score>0.3?1:factor_score<-0.3?-1:0,factor_score,mom1m:mom1m!=null?mom1m*100:null,mom3m:mom3m!=null?mom3m*100:null,mom6m:mom6m!=null?mom6m*100:null,vol20:vol20!=null?vol20*100:null,above_ma20,above_ma60};
}

function computeIPP(bars, ind) {
  const n = bars.length;
  if (n < 30) return { ipp_score: 0, direction: 'NEUTRAL', eta_days: 5, confidence: 0, signals: [] };
  const C = bars.map(b => b.close), H = bars.map(b => b.high), L = bars.map(b => b.low), V = bars.map(b => b.volume || 0);
  const li = n - 1;

  // 규칙 기반 신호 탐지
  const signals = [];
  let rule_score = 0;

  // RSI 과매도/과매수
  const rsi = last(ind.rsi);
  if (rsi != null && rsi < 30)  { rule_score += 20; signals.push('🔴 RSI 과매도 (' + rsi.toFixed(1) + ')'); }
  if (rsi != null && rsi > 70)  { rule_score -= 20; signals.push('🔵 RSI 과매수 (' + rsi.toFixed(1) + ')'); }

  // 연속 하락 4일+ + 긴 아래꼬리
  let consec_down = 0;
  for (let i = li; i >= Math.max(0, li-5); i--) { if (C[i] < C[i-1]) consec_down++; else break; }
  const body = Math.abs(C[li] - bars[li].open);
  const lower_shadow = Math.min(C[li], bars[li].open) - L[li];
  if (consec_down >= 4 && lower_shadow > body * 1.5) { rule_score += 25; signals.push('🔨 ' + consec_down + '일 연속하락 + 긴 아래꼬리'); }

  // 연속 상승 4일+ + 긴 윗꼬리
  let consec_up = 0;
  for (let i = li; i >= Math.max(0, li-5); i--) { if (C[i] > C[i-1]) consec_up++; else break; }
  const upper_shadow = H[li] - Math.max(C[li], bars[li].open);
  if (consec_up >= 4 && upper_shadow > body * 1.5) { rule_score -= 25; signals.push('⚡ ' + consec_up + '일 연속상승 + 긴 윗꼬리'); }

  // OBV 다이버전스
  let obv = 0; const obvArr = [];
  for (let i = 0; i < n; i++) { obv += (i === 0 ? 0 : C[i] > C[i-1] ? V[i] : C[i] < C[i-1] ? -V[i] : 0); obvArr.push(obv); }
  const obvSlope = n >= 10 ? obvArr[li] - obvArr[li-10] : 0;
  const priceSlope = n >= 10 ? C[li] - C[li-10] : 0;
  if (obvSlope > 0 && priceSlope < 0) { rule_score += 20; signals.push('📈 OBV↑ + 주가↓ (강세 다이버전스)'); }
  if (obvSlope < 0 && priceSlope > 0) { rule_score -= 20; signals.push('📉 OBV↓ + 주가↑ (약세 다이버전스)'); }

  // 거래량 수렴/급증
  if (n >= 21) {
    const vol20avg = V.slice(li-19, li+1).reduce((a,b) => a+b, 0) / 20;
    const vol5avg  = V.slice(li-4,  li+1).reduce((a,b) => a+b, 0) / 5;
    const volRatio = vol20avg > 0 ? vol5avg / vol20avg : 1;
    if (volRatio < 0.5) { rule_score += 10; signals.push('📊 거래량 바닥 수렴 (' + volRatio.toFixed(2) + 'x)'); }
    if (volRatio > 2.0 && Math.abs(priceSlope) / C[li-10] < 0.01) { rule_score -= 15; signals.push('💥 거래량 급증 + 가격 미반응'); }
  }

  // 볼린저밴드 수축 (밴드폭 / 중심선)
  const bbUv = last(ind.bbU), bbLv = last(ind.bbL), sma20v = last(ind.sma20);
  const bbW = (bbUv != null && bbLv != null && sma20v != null && sma20v > 0) ? (bbUv - bbLv) / sma20v : null;
  if (bbW != null && bbW < 0.05) { rule_score += 12; signals.push('🎯 BB 수축 (에너지 축적)'); }

  // ATR 수축
  const atr = last(ind.atr);
  const atrMA = n >= 30 ? ind.atr.slice(li-29, li+1).filter(v=>v!=null).reduce((a,b)=>a+b,0)/30 : null;
  if (atr != null && atrMA != null && atr < atrMA * 0.7) { rule_score += 10; signals.push('🔇 ATR 수축 (<0.7배, 변동성 소진)'); }

  // 앙상블: 규칙 기반만 사용 (ML·뉴스는 브라우저 환경 불가)
  const ipp_score = Math.max(-100, Math.min(100, rule_score));
  const direction = ipp_score >= 20 ? 'BULLISH_REVERSAL' : ipp_score <= -20 ? 'BEARISH_REVERSAL' : 'NEUTRAL';
  const confidence = Math.min(100, Math.round(Math.abs(ipp_score)));
  const eta_days = Math.abs(ipp_score) >= 40 ? 3 : Math.abs(ipp_score) >= 20 ? 5 : 7;

  return { ipp_score, direction, eta_days, confidence, signals };
}

// ind 마지막 값 헬퍼 (기존 last와 충돌 방지)
function lastVal(arr) { if (!arr || arr.length === 0) return null; return arr[arr.length-1]; }

function fuseAdvancedSignals(cs,ew,ichi,smc,quant,ipp){
  const W={cs:1.5,ew:2.0,ichi:1.5,smc:1.5,quant:2.0,ipp:2.0};
  const ippSig=ipp?.ipp_score>=20?1:ipp?.ipp_score<=-20?-1:0;
  const sigs={cs:cs.cs_signal,ew:ew.ew_signal,ichi:ichi.ichi_signal,smc:smc.smc_signal,quant:quant.quant_signal,ipp:ippSig};
  let wsum=0,wtotal=0;const details={};
  for(const[key,w]of Object.entries(W)){const val=sigs[key]||0;wsum+=val*w;wtotal+=w;details[key]={score:val,weight:w,label:val>0?'▲ 매수':val<0?'▼ 매도':'— 관망'};}
  return{composite:wtotal>0?wsum/wtotal:0,details};
}

function norm(v,lo,mid,hi){if(v<=lo)return-1;if(v>=hi)return 1;return v<mid?(v-lo)/(mid-lo)-1:(v-mid)/(hi-mid);}
const normInv=(v,lo,mid,hi)=>-norm(v,lo,mid,hi);
function scoreToSignal(s){if(s>0.6)return'STRONG_BUY';if(s>0.2)return'BUY';if(s<-0.6)return'STRONG_SELL';if(s<-0.2)return'SELL';return'NEUTRAL';}

function scoreTechnical(ind,price){
  const mh=last(ind.hist),atrV=last(ind.atr),rsiV=last(ind.rsi),bbP=last(ind.bbPct),k=last(ind.stochK),d=last(ind.stochD),vr=last(ind.volRatio);
  const C=ind.C,lastDiff=C[C.length-1]-C[C.length-2];
  const clip=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const macdScore=Math.tanh(mh/(atrV+1e-9));
  let rsiScore=rsiV<30?(30-rsiV)/30:rsiV>70?(70-rsiV)/30:(50-rsiV)/50*0.3;rsiScore=clip(rsiScore,-1,1);
  const bbScore=clip(1-2*bbP,-1,1),stochScore=k<20&&k>d?0.8:k>80&&k<d?-0.8:(50-k)/50*0.3,volScore=Math.tanh(vr-1)*Math.sign(lastDiff);
  const score=macdScore*0.25+rsiScore*0.20+bbScore*0.20+stochScore*0.15+volScore*0.20;
  return{signal:scoreToSignal(score),score,confidence:Math.min(Math.abs(score)*1.5,1.0),atr:atrV,
    indicators:{rsi:rsiV,macd:last(ind.macdLine),macdHist:mh,stochK:k,stochD:d,bbPct:bbP,bbUpper:last(ind.bbU),bbLower:last(ind.bbL),atr:atrV,volRatio:vr}};
}

function scoreFundamental(info,price){
  const pct2num=v=>(v!=null&&!isNaN(v))?(Math.abs(v)<2?v*100:v):null;
  const g=(k,def)=>{const v=info[k];return(v!=null&&!isNaN(v))?v:def;};
  const per=g('trailingPE',25),pbr=g('priceToBook',2),roe=pct2num(g('returnOnEquity',0.10))??10,netMargin=pct2num(g('profitMargins',0.05))??5;
  const revGrowth=pct2num(g('revenueGrowth',0.05))??5,earnGrowth=pct2num(g('earningsGrowth',0.05))??5,debtEq=g('debtToEquity',100),currRatio=g('currentRatio',1.5),divYield=pct2num(g('dividendYield',0))??0;
  const val=(normInv(per,10,20,35)+normInv(pbr,0.8,2.0,4.0))/2,prof=(norm(roe,5,15,25)+norm(netMargin,2,10,20))/2;
  const growth=(norm(revGrowth,0,10,30)+norm(earnGrowth,0,15,40))/2,health=(normInv(debtEq,50,100,200)+norm(currRatio,1.0,1.5,3.0))/2;
  const score=val*0.30+prof*0.25+growth*0.25+health*0.20;
  return{signal:scoreToSignal(score),score,confidence:Math.min(Math.abs(score)*1.2,1.0),intrinsic:price*(score*0.3+1.0),
    metrics:{per,pbr,roe,netMargin,revGrowth,earnGrowth,debtEq,currRatio,divYield}};
}

function makeDecision(tech,fund,style,price,advanced){
  const W={short_term:[0.75,0.25],balanced:[0.60,0.40],long_term:[0.35,0.65]};
  const[tw,fw]=W[style]||W.balanced;
  const base=tech.score*tw+fund.score*fw;
  const adv=advanced||{composite:0};
  const combined=base*0.60+adv.composite*0.40;
  let conf=tech.confidence*tw+fund.confidence*fw;
  const sameDir=(tech.score>0&&fund.score>0)||(tech.score<0&&fund.score<0);
  if(sameDir)conf=Math.min(conf*1.2,1.0);else conf*=0.8;
  const atr=tech.atr,action=combined>0.25&&conf>0.5?'BUY':combined<-0.25&&conf>0.5?'SELL':'HOLD';
  const targetPrice=action==='BUY'?price+atr*2.5:action==='SELL'?price-atr*2.5:price+atr*1.5;
  const stopLoss=action==='BUY'?price-atr*1.0:action==='SELL'?price+atr*1.0:price-atr*1.0;
  const risk=Math.abs(price-stopLoss),reward=Math.abs(targetPrice-price);
  return{action,confidence:Math.round(conf*1000)/1000,targetPrice,stopLoss,rr:risk>0?Math.round(reward/risk*10)/10:0,techScore:tech.score,fundScore:fund.score,combined:Math.round(combined*10000)/10000,advancedComposite:Math.round(adv.composite*1000)/1000};
}

function scoreToPct(score, min=-1, max=1) {
  // -1~+1 범위를 0~100%로 변환
  return Math.round(((score - min) / (max - min)) * 100);
}

function barClass(score) {
  if (score > 0.1) return 'bull';
  if (score < -0.1) return 'bear';
  return 'neutral';
}
function valClass(score) {
  return score > 0.1 ? '' : score < -0.1 ? 'bear' : 'neutral';
}
function sigTag(score) {
  const cls = score > 0.1 ? 'buy' : score < -0.1 ? 'sell' : 'hold';
  const txt = score > 0.5 ? '강한 매수' : score > 0.1 ? '매수' : score < -0.5 ? '강한 매도' : score < -0.1 ? '매도' : '관망';
  return `<span class="signal-tag ${cls}">${txt}</span>`;
}

function metricBlock({ subTitle, barPct, barScore, valueText, descLabel, descHtml }) {
  const bc = barClass(barScore), vc = valClass(barScore);
  return `
  <div class="metric-block">
    <div class="sub-title">${subTitle}</div>
    <div class="bar-row">
      <div class="bar-wrap">
        <div class="bar-fill ${bc}" style="width:${Math.max(2,Math.min(100,barPct))}%"></div>
      </div>
      <div class="bar-value ${vc}">${valueText}</div>
    </div>
    ${sigTag(barScore)}
    <div class="desc-section">
      <div class="desc-label">${descLabel}</div>
      <div class="desc-box">${descHtml}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════
//  백테스트 — 슬라이딩 윈도우로 과거 신호 적중률 계산
// ══════════════════════════════════════════════════════
function computeBacktest(bars) {
  const MIN_BARS  = 60;   // 지표 안정화 최소 구간
  const HORIZONS  = [5, 10, 20]; // 보유 기간(거래일)
  const MAX_HOLD  = 20;
  const STEP      = 3;    // 매 3일마다 샘플 (성능/표본 균형)

  if (bars.length < MIN_BARS + MAX_HOLD + 10) return null;

  const buckets = { BUY: [], SELL: [], HOLD: [] };

  for (let t = MIN_BARS; t < bars.length - MAX_HOLD; t += STEP) {
    try {
      const ind   = computeIndicators(bars.slice(0, t + 1));
      const tech  = scoreTechnical(ind, bars[t].close);
      // 기술적 점수만으로 신호 판정 (기본적 분석은 과거 시점 재현 불가)
      const sig   = tech.score > 0.15 ? 'BUY' : tech.score < -0.15 ? 'SELL' : 'HOLD';
      const entry = bars[t].close;
      const outcomes = {};
      HORIZONS.forEach(h => {
        if (t + h < bars.length) outcomes[h] = (bars[t + h].close - entry) / entry;
      });
      buckets[sig].push({ outcomes });
    } catch(_) { /* 슬라이스 데이터 부족 시 skip */ }
  }

  const stats = {};
  ['BUY', 'SELL', 'HOLD'].forEach(sig => {
    const arr = buckets[sig];
    if (!arr.length) { stats[sig] = null; return; }
    const hStats = {};
    HORIZONS.forEach(h => {
      const valid = arr.filter(s => s.outcomes[h] != null);
      if (!valid.length) { hStats[h] = null; return; }
      const rets  = valid.map(s => s.outcomes[h]);
      const avg   = rets.reduce((a, b) => a + b, 0) / rets.length;
      // 적중: BUY→양전환, SELL→음전환, HOLD→±2% 이내 횡보
      const hits  = valid.filter(s => {
        const r = s.outcomes[h];
        if (sig === 'BUY')  return r > 0;
        if (sig === 'SELL') return r < 0;
        return Math.abs(r) < 0.02;
      }).length;
      hStats[h] = {
        n:       valid.length,
        hitRate: Math.round(hits / valid.length * 100),
        avgRet:  Math.round(avg * 1000) / 10,   // % 단위, 소수 1자리
      };
    });
    stats[sig] = { count: arr.length, h: hStats };
  });
  return stats;
}

function renderBacktest(stats, bars) {
  if (!stats) return `
    <div style="color:var(--muted2);font-size:0.75rem;text-align:center;padding:10px 0">
      📉 데이터 부족 — 백테스트 최소 80거래일 필요
    </div>`;

  const months   = Math.round(bars.length / 21);
  const HORIZONS = [5, 10, 20];

  const rows = ['BUY', 'SELL'].map(sig => {
    const s = stats[sig];
    const isBuy  = sig === 'BUY';
    const color  = isBuy ? 'var(--green)' : 'var(--red)';
    const label  = isBuy ? '▲ 매수신호' : '▼ 매도신호';

    const cells = HORIZONS.map(h => {
      const hs = s?.h[h];
      if (!hs) return `<td style="text-align:center;padding:5px 4px;font-size:0.68rem;color:var(--muted2)">-</td>`;
      const rateColor = hs.hitRate >= 60 ? 'var(--green)' : hs.hitRate >= 45 ? 'var(--yellow)' : 'var(--red)';
      const retSign   = hs.avgRet >= 0 ? '+' : '';
      const retColor  = (isBuy && hs.avgRet > 0) || (!isBuy && hs.avgRet < 0) ? 'var(--green)' : 'var(--red)';
      return `<td style="text-align:center;padding:5px 4px">
        <div style="font-size:0.76rem;font-weight:700;color:${rateColor}">${hs.hitRate}%</div>
        <div style="font-size:0.62rem;color:${retColor};margin-top:1px">${retSign}${hs.avgRet}%</div>

    }).join('');

    const count = s ? `<td style="text-align:center;padding:5px 4px;font-size:0.68rem;color:var(--muted)">${s.count}회</td>` :
                      `<td style="text-align:center;padding:5px 4px;font-size:0.68rem;color:var(--muted2)">-</td>`;

    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:6px 8px;font-size:0.75rem;font-weight:700;color:${color};white-space:nowrap">${label}</td>
      ${count}${cells}
    </tr>`;
  }).join('');

  return `
  <div style="margin-top:16px">
    <div style="font-size:0.68rem;font-weight:700;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">

    </div>

      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:var(--card2);border-bottom:1px solid var(--border)">
            <th style="padding:5px 8px;text-align:left;font-size:0.62rem;color:var(--muted2);font-weight:600">신호</th>
            <th style="padding:5px 4px;text-align:center;font-size:0.62rem;color:var(--muted2);font-weight:600">횟수</th>
            <th style="padding:5px 4px;text-align:center;font-size:0.62rem;color:var(--muted2);font-weight:600">5일<br>적중·수익</th>
            <th style="padding:5px 4px;text-align:center;font-size:0.62rem;color:var(--muted2);font-weight:600">10일<br>적중·수익</th>
            <th style="padding:5px 4px;text-align:center;font-size:0.62rem;color:var(--muted2);font-weight:600">20일<br>적중·수익</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:6px;font-size:0.61rem;color:var(--muted2);line-height:1.6">
      적중률 = 신호 방향대로 가격이 움직인 비율 &nbsp;·&nbsp; 수익률 = 해당 기간 평균 등락률<br>
      기술적 신호 기반 · 3거래일 간격 샘플링 · 기본적 분석 미포함

  </div>`;
}

        <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">신뢰도 ${Math.round(d.confidence*100)}% &nbsp;·&nbsp; R:R ${d.rr.toFixed(1)}:1 &nbsp;·&nbsp; 목표 ${fmt(d.targetPrice,isKr)} / 손절 ${fmt(d.stopLoss,isKr)}</div>
      </div>
    </div>

    <div style="font-size:0.7rem;font-weight:700;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">📋 근거 체크리스트</div>
    <div style="margin-bottom:16px;padding:10px 12px;background:var(--card2);border-radius:8px;border:1px solid var(--border)">
      ${condHtml}
    </div>

    <div style="font-size:0.7rem;font-weight:700;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">✅ 실행 단계</div>
    <ol style="padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:0.82rem;line-height:1.55">
      ${steps.join('')}
    </ol>

    ${renderBacktest(btStats, bars)}

    <div style="margin-top:14px;font-size:0.68rem;color:var(--muted);padding:8px 12px;background:rgba(251,191,36,.06);border-radius:6px;border-left:3px solid var(--yellow);line-height:1.7">
      ⚠️ 본 리포트는 <b>참고용 정보</b>로, 투자 결정의 최종 책임은 본인에게 있습니다. 과거 신호가 미래 수익을 보장하지 않으며, 항상 분산투자 및 리스크 관리를 병행하세요.
    </div>
  </div>`;
  })()}
  `;
}

(async () => {
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker') || 'AAPL';
  const period = params.get('period') || '6mo';
  const style  = params.get('style')  || 'balanced';

  // 보관함 iframe 모드: topbar 숨김
  if (params.get('embedded') === '1') {
    document.body.classList.add('embedded');
  }

  document.title = `${ticker} 리포트 — SIGNNITH`;

  try {
    const [ohlcvData, fundInfo, quote] = await Promise.all([
      fetchOHLCV(ticker, period),
      fetchFundamentals(ticker),
      fetchQuote(ticker),
    ]);

    const { bars, currency, regularMarketPrice, previousClose } = ohlcvData;
    const isKr = currency === 'KRW';
    const price = quote?.regularMarketPrice || regularMarketPrice || bars[bars.length-1].close;
    const prevClose = bars[bars.length-2]?.close || quote?.regularMarketPreviousClose || previousClose;

    const ind      = computeIndicators(bars);
    const tech     = scoreTechnical(ind, price);
    const fund     = scoreFundamental(fundInfo, price);
    const cs       = computeCandlestick(bars);
    const ew       = computeElliottWave(bars);
    const ichi     = computeIchimoku(bars);
    const smc      = computeSMC(bars);
    const quant    = computeQuantFactors(bars, ind);
    const ipp      = computeIPP(bars, ind);
    const advanced = fuseAdvancedSignals(cs, ew, ichi, smc, quant, ipp);
    const d        = makeDecision(tech, fund, style, price, advanced);

    // 종목명 우선순위: fundInfo → quote longName/shortName → KR_NAME_MAP → EN_TICKER_NAME_R → ticker
    const _rawName = (fundInfo.companyName && fundInfo.companyName !== ticker)
      ? fundInfo.companyName
      : (quote?.longName || quote?.shortName || fundInfo.companyName || '');
    const cleanTicker = ticker.replace(/\.(KS|KQ|KP|T|L|HK)$/i, '');
    const companyName = (_rawName && _rawName !== ticker && _rawName !== cleanTicker)
      ? _rawName
      : (KR_NAME_MAP[ticker] || EN_TICKER_NAME_R[cleanTicker] || ticker);

    document.title = `${companyName} (${ticker}) 리포트 — SIGNNITH`;

    const waccResult = computeWACCR(fundInfo, isKr);
    // Exchange name for US stocks
    const exchangeName = isKr ? '' : (fundInfo.exchange || quote?.exchange || (ticker.includes('.') ? '' : (ticker.length <= 4 ? 'NYSE' : 'NASDAQ')));
    renderReport({
      ticker, price, prevClose, isKr, currency, ind, tech, fund, d, cs, ew, ichi, smc, quant, advanced, ipp,
      companyName, bars,
      sector: fundInfo.sector || '-',
      waccResult,
      exchangeName,
    });

  } catch(e) {
    document.getElementById('report-content').innerHTML = `
      <div class="center-msg">
        <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
        <div style="color:#be123c;font-weight:600;margin-bottom:8px">분석 실패</div>
        <div style="color:var(--muted2)">${e.message}</div>
      </div>`;
  }
})();

const THEME_KEY = 'tsa_theme';

// index.html에서 저장한 테마를 그대로 불러옴 (읽기 전용)
function applyThemeR(theme) {
  const isLight = theme === 'light' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.classList.toggle('light', isLight);

// ══════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════
// ── Particle Network Background ──
// ══════════════════════════════════════════════════════
(function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const CFG = {
    SPEED_MAX:       0.38,
    RADIUS:          1.5,
    GLOW_RADIUS:     3.2,
    LINK_DIST:       150,
    MOUSE_DIST:      150,
    REPEL_STRENGTH:  5.0,
    REPEL_EASE:      0.08,
  };

  function isDark() { return !document.documentElement.classList.contains('light'); }

  const DARK_P  = [160, 200, 255];
  const DARK_L  = [100, 160, 255];
  const DARK_ML = [140, 110, 255];
  const LIGHT_P = [80,  120, 200];
  const LIGHT_L = [60,  100, 180];
  const LIGHT_ML= [110,  70, 200];

  let W, H, particles;
  const mouse = { x: -9999, y: -9999 };

  class Particle {
    constructor() {
      this.x      = Math.random() * W;
      this.y      = Math.random() * H;
      const spd   = 0.08 + Math.random() * CFG.SPEED_MAX;
      const ang   = Math.random() * Math.PI * 2;
      this.vx     = Math.cos(ang) * spd;
      this.vy     = Math.sin(ang) * spd;
      this.rx     = 0; this.ry = 0;
      this.alpha  = 0.25 + Math.random() * 0.45;
      this.r      = CFG.RADIUS * (0.7 + Math.random() * 0.6);
      this.phase  = Math.random() * Math.PI * 2;
      this.wobble = (Math.random() - 0.5) * 0.005;
    }
    update(dt) {
      this.phase += this.wobble * dt;
      const cos = Math.cos(this.phase * 0.35), sin = Math.sin(this.phase * 0.35);
      const nx = this.vx * cos - this.vy * sin, ny = this.vx * sin + this.vy * cos;
      this.vx = nx; this.vy = ny;
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const d  = Math.hypot(dx, dy);
      if (d < CFG.MOUSE_DIST && d > 0) {
        const f = (1 - d / CFG.MOUSE_DIST) * CFG.REPEL_STRENGTH;
        this.rx += (dx / d) * f; this.ry += (dy / d) * f;
      }
      this.vx += this.rx * CFG.REPEL_EASE; this.vy += this.ry * CFG.REPEL_EASE;
      this.rx *= 0.82; this.ry *= 0.82;
      const spd = Math.hypot(this.vx, this.vy), max = CFG.SPEED_MAX * 2.4;
      if (spd > max) { this.vx = (this.vx / spd) * max; this.vy = (this.vy / spd) * max; }
      this.x += this.vx * (dt / 16); this.y += this.vy * (dt / 16);
      if (this.x < -20) this.x = W + 20; if (this.x > W + 20) this.x = -20;
      if (this.y < -20) this.y = H + 20; if (this.y > H + 20) this.y = -20;
    }
    draw(cp) {
      const [r, g, b] = cp;
      const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, CFG.GLOW_RADIUS * this.r);
      grd.addColorStop(0,   `rgba(${r},${g},${b},${this.alpha * 0.85})`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},${this.alpha * 0.25})`);
      grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.beginPath(); ctx.arc(this.x, this.y, CFG.GLOW_RADIUS * this.r, 0, Math.PI * 2);
      ctx.fillStyle = grd; ctx.fill();
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`; ctx.fill();
    }
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.min(Math.floor((W * H) / 10000), 180);
    if (!particles || Math.abs(particles.length - count) > 15)
      particles = Array.from({ length: count }, () => new Particle());
  }

  let last = 0;
  function frame(ts) {
    const dt = Math.min(ts - last, 50); last = ts;
    const dark = isDark();
    const cp = dark ? DARK_P : LIGHT_P;
    const cl = dark ? DARK_L : LIGHT_L;
    const cm = dark ? DARK_ML: LIGHT_ML;
    const maxLA = dark ? 0.52 : 0.22, maxMA = dark ? 0.50 : 0.28;

    ctx.clearRect(0, 0, W, H);
    for (const p of particles) p.update(dt);

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < CFG.LINK_DIST) {
          const op = (1 - d / CFG.LINK_DIST) * maxLA;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${cl[0]},${cl[1]},${cl[2]},${op})`;
          ctx.lineWidth = op * 1.8; ctx.stroke();
        }
      }
    }
    const mx = mouse.x, my = mouse.y;
    for (const p of particles) {
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < CFG.MOUSE_DIST) {
        const op = (1 - d / CFG.MOUSE_DIST) * maxMA;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my);
        ctx.strokeStyle = `rgba(${cm[0]},${cm[1]},${cm[2]},${op * 0.55})`;
        ctx.lineWidth = op * 1.1; ctx.stroke();
      }
    }
    for (const p of particles) p.draw(cp);

    if (mouse.x > 0) {
      const mg = ctx.createRadialGradient(mx, my, 0, mx, my, CFG.MOUSE_DIST * 0.55);
      mg.addColorStop(0, dark ? 'rgba(110,80,220,0.05)' : 'rgba(80,100,200,0.04)');
      mg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(mx, my, CFG.MOUSE_DIST * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = mg; ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener('touchmove', e => {
    mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; });
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  resize();
  requestAnimationFrame(frame);
})();

// ── Aurora Blob Background ──
// ══════════════════════════════════════════════════════
(function initAurora() {
  const canvas = document.getElementById('aurora-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const darkBlobs = [
    { x:.18, y:.22, r:.38, color:'rgba(108,92,231,',  vx:.00012, vy:.00008, phase:0   },
    { x:.72, y:.15, r:.32, color:'rgba(0,153,255,',   vx:-.0001, vy:.00013, phase:1.2 },
    { x:.55, y:.72, r:.42, color:'rgba(0,212,170,',   vx:.00009, vy:-.0001, phase:2.4 },
    { x:.10, y:.75, r:.28, color:'rgba(167,139,250,',  vx:.00014, vy:.00006, phase:0.7 },
    { x:.88, y:.58, r:.34, color:'rgba(236,72,153,',   vx:-.0001, vy:-.0001, phase:3.1 },
    { x:.42, y:.42, r:.25, color:'rgba(56,189,248,',   vx:.00007, vy:.00015, phase:1.8 },
  ];
  const lightBlobs = [
    { x:.20, y:.18, r:.40, color:'rgba(255,182,159,',  vx:.00010, vy:.00007, phase:0   },
    { x:.75, y:.20, r:.35, color:'rgba(129,236,236,',  vx:-.0009, vy:.00012, phase:1.4 },
    { x:.50, y:.68, r:.44, color:'rgba(253,242,180,',  vx:.00008, vy:-.0009, phase:2.6 },
    { x:.12, y:.70, r:.30, color:'rgba(210,196,255,',  vx:.00013, vy:.00006, phase:0.9 },
    { x:.85, y:.55, r:.32, color:'rgba(255,214,214,',  vx:-.0008, vy:-.0008, phase:3.3 },
    { x:.40, y:.38, r:.28, color:'rgba(180,235,220,',  vx:.00006, vy:.00014, phase:2.0 },
  ];

  let W, H, t = 0, running = false;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function isDark() { return !document.documentElement.classList.contains('light'); }

  function draw() {
    canvas.style.visibility = 'visible';
    running = true;
    ctx.clearRect(0, 0, W, H);

    const dark = isDark();
    const angle = 160 * Math.PI / 180;
    const L = Math.sqrt(W * W + H * H);
    const cx = W / 2, cy = H / 2;
    const x0 = cx - Math.cos(angle) * L / 2, y0 = cy - Math.sin(angle) * L / 2;
    const x1 = cx + Math.cos(angle) * L / 2, y1 = cy + Math.sin(angle) * L / 2;
    const bg = ctx.createLinearGradient(x0, y0, x1, y1);
    if (dark) {
      bg.addColorStop(0, '#050810');
      bg.addColorStop(1, '#080520');
    } else {
      bg.addColorStop(0,   '#F8F1EE');
      bg.addColorStop(0.5, '#ECF8F8');
      bg.addColorStop(1,   '#FCFAF2');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const blobs = dark ? darkBlobs : lightBlobs;
    const coreAlpha = dark ? 0.14 : 0.50;
    const midAlpha  = dark ? 0.06 : 0.22;

    for (const b of blobs) {
      const pulse = 1 + 0.06 * Math.sin(t * 0.0008 + b.phase);
      const bx = (b.x + Math.sin(t * b.vx + b.phase) * 0.18) * W;
      const by = (b.y + Math.cos(t * b.vy + b.phase) * 0.15) * H;
      const br = b.r * Math.min(W, H) * pulse;
      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      grad.addColorStop(0,   b.color + coreAlpha + ')');
      grad.addColorStop(0.4, b.color + midAlpha  + ')');
      grad.addColorStop(1,   b.color + '0)');
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.fillStyle = dark ? 'rgba(0,0,0,0.38)' : 'rgba(255,255,255,0.28)';
    ctx.fillRect(0, 0, W, H);

    t++;
    requestAnimationFrame(draw);
  }

  new MutationObserver(() => {
    if (!running) requestAnimationFrame(draw);
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  requestAnimationFrame(draw);
})();
